spring:
  application:
    name: ledger-wallet-api

  datasource:
    # No default values: a fallback on a secret is a hardcoded secret (rules.md 2.5).
    # Startup fails loudly if these are unset, which is the intended behaviour.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that it matches and never
      # mutates it, in any environment.
      ddl-auto: validate
    # Keeping the persistence context open across view rendering hides lazy loads
    # behind the web layer and makes transaction boundaries unclear.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    # Not a secret, so a local default is fine here — unlike the datasource and JWT
    # settings below, where a fallback would be a committed credential.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Wait for every in-sync replica before considering a send successful. A weaker
      # setting can drop an event during a broker failover without telling anyone,
      # which for an audit stream is the one failure that must not be silent.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # No type headers on the wire: consumers should not be told which Java class
        # produced a message, and a foreign consumer cannot use it anyway.
        spring.json.add.type.headers: false
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wraps the JSON deserializer so a malformed message becomes a handled failure
      # routed to the DLT, rather than an exception that stalls the partition forever.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # Explicit allowlist: never deserialise into whatever class a message names.
        spring.json.trusted.packages: com.anas.ledgerwallet.ledger.event
        spring.json.value.default.type: com.anas.ledgerwallet.ledger.event.TransactionEventPayload

app:
  kafka:
    transaction-topic: transaction-events
    audit-group-id: audit-log

  # Brute-force and enumeration protection on the only two endpoints reachable
  # without a token. Per client address, enforced in this instance's memory.
  rate-limit:
    login:
      # Ten attempts, then roughly one every six seconds as the bucket refills.
      # Comfortable for someone mistyping a password; useless for a password list.
      capacity: 10
      refill-period: 1m
    register:
      # Lower: nobody legitimately creates accounts in bursts, and every attempt
      # here answers "is this email already registered".
      capacity: 5
      refill-period: 1m

security:
  jwt:
    # No default: a fallback signing key is a hardcoded secret, and it is the one that
    # ends up deployed (rules.md 2.5). Must be at least 32 bytes for HS256 — JwtService
    # refuses to start otherwise.
    secret: ${JWT_SECRET}
    # Short-lived by design: these tokens carry no revocation mechanism, so a leaked
    # one stays usable until it expires.
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}

server:
  port: ${SERVER_PORT:8080}
  error:
    # Never expose stack traces or internal messages in an HTTP response.
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: INFO
